name: iot

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iot-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: iot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-120}
      # 앱키는 .env 에서 넘어옵니다. 여기에도 코드에도 값을 적지 않습니다
      KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
      KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
      KIS_LIVE_APP_KEY: ${KIS_LIVE_APP_KEY:-}
      KIS_LIVE_APP_SECRET: ${KIS_LIVE_APP_SECRET:-}
      # KRX 로그인(pykrx 용). 값은 .env 에서 넘어오고 코드에는 적지 않습니다
      KRX_ID: ${KRX_ID:-}
      KRX_PW: ${KRX_PW:-}
      # Windows 바인드 마운트에서는 inotify가 안 올라와서 폴링이 필요합니다
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      # 테스트는 이미지에 굽지 않고 붙여서 씁니다 — 고치면 재빌드 없이 바로 돌아갑니다
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      # 학습된 모델엔 비밀이 없어 KIS 토큰과 달리 휘발시킬 이유가 없습니다 —
      # 재빌드해도 안 날아가게 전용 볼륨에 둡니다 (호스트·git 으로는 안 나갑니다)
      - ml-models:/tmp/ml-models
    depends_on:
      timescaledb:
        condition: service_healthy
    # 발표 당일 임시 조치: OneDrive 동기화 폴더 안이라 --reload(WATCHFILES_FORCE_POLLING)가
    # OneDrive 의 백그라운드 파일 접근을 "코드가 바뀐 줄" 오인해 무거운 계산 중에도
    # 수시로 서버를 재시작시켰습니다. 안정성이 더 중요해 일단 껐습니다 — 평소 개발
    # 때는 다시 --reload 를 붙이는 게 편합니다.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    container_name: iot-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

  # DB 를 눈으로 확인하는 도구입니다. 앱이 아닙니다 — 여기서 줄을 고쳐 기능을 만들지 않습니다
  adminer:
    image: adminer:4.8.1
    container_name: iot-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescale-data:
  ml-models:
